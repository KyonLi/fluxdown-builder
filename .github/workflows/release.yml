name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.version }}

jobs:
  build-web:
    name: Build Server Web SPA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: 'zerx-lab/FluxDown'
          ref: ${{ env.TAG }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build web SPA
        working-directory: web
        run: bun run build

      - name: Upload webroot artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-webroot
          path: web/dist

  build-server-binaries:
    name: Build Server (${{ matrix.platform }})
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: 'zerx-lab/FluxDown'
          ref: ${{ env.TAG }}

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          TAG=${{ env.TAG }}
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl-gcc：ring/bundled-sqlite/zstd 等 C 依赖静态编译所需
      - name: Install musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: server-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            server-${{ matrix.platform }}-

      # 前端产物必须在 cargo build 之前就位：build.rs 按 FLUXDOWN_EMBED_WEBROOT
      # 把 web/dist 全量 include_bytes! 进二进制（单文件分发）。
      - name: Download webroot artifact
        uses: actions/download-artifact@v4
        with:
          name: server-webroot
          path: webroot

      # x86_64 目标使用基线 x86-64（RUSTFLAGS 整体替换 .cargo/config.toml 的 rustflags，
      # 该文件当前只有 target-cpu 一项）；产品版本由 FLUXDOWN_APP_VERSION 注入。
      - name: Build server binaries (agent + daemon)
        env:
          FLUXDOWN_EMBED_WEBROOT: ${{ github.workspace }}/webroot
          FLUXDOWN_APP_VERSION: ${{ steps.version.outputs.VERSION }}
          RUSTFLAGS: ${{ startsWith(matrix.target, 'x86_64') && '-C target-cpu=x86-64' || '' }}
        run: |
          cargo build --release --locked -p fluxdown_agent --features web-ui --target ${{ matrix.target }}
          cargo build --release --locked -p fluxdown_daemon --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          PKG="fluxdown-server-${VERSION}-${{ matrix.platform }}"
          mkdir -p "build/server/${PKG}" release-assets
          cp "target/${{ matrix.target }}/release/fluxdown-agent" "target/${{ matrix.target }}/release/fluxdownd" "build/server/${PKG}/"
          tar -C build/server -czf "release-assets/FluxDown-Server-${VERSION}-${{ matrix.platform }}.tar.gz" "${PKG}"
          ls -la release-assets/

      - name: Upload server binary artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: server-bin-${{ matrix.platform }}
          path: release-assets/*

  release-server:
    name: Release Server
    runs-on: ubuntu-latest
    needs: build-server-binaries

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: server-bin-*
          path: release-assets/
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: List release assets
        run: ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          name: FluxDown Server ${{ env.TAG }}
          files: release-assets/*

